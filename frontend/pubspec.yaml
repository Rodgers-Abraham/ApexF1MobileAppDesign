name: f1
description: "F1 Apex - Ultimate Formula 1 companion app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.5.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.0.1
  purchases_flutter: ^8.1.0
  google_mobile_ads: ^5.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/circuits/
    - assets/logo.png
    - assets/teams/
    - assets/drivers/
    - assets/helmets/
    - assets/numbers/
    - assets/f1_2026_db.json
    - .env

  fonts:
    - family: Formula1
      fonts:
        - asset: assets/fonts/Formula1-Regular.otf
        - asset: assets/fonts/Formula1-Italic.otf
          style: italic
        - asset: assets/fonts/Formula1-Bold.otf
          weight: 700
        - asset: assets/fonts/Formula1-Black.otf
          weight: 900
    - family: Formula1Wide
      fonts:
        - asset: assets/fonts/Formula1-Wide.otf


